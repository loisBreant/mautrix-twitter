# Proxy to use for all Twitter connections.
proxy: null
# Alternative to proxy: an HTTP endpoint that returns the proxy URL to use for Twitter connections.
get_proxy_url: null

# Displayname template for Twitter users.
# {{ .DisplayName }} is replaced with the display name of the Twitter user.
# {{ .Username }} is replaced with the username of the Twitter user.
displayname_template: "{{ .DisplayName }} (Twitter)"

# Maximum number of conversations to import when an account first logs in. X returns
# conversations 20 at a time, so the import stops after the page that reaches the limit.
# 0 or less imports every conversation. Reconnects always catch up on every conversation.
conversation_sync_limit: 20

# Seconds between two REST polls for legacy (non X Chat) message requests and chats,
# which the X Chat websocket doesn't deliver. Each wait is drawn between min and max.
polling_interval:
    min: 60
    max: 120

# Should the bridge cache sessions instead of resyncing chats on every restart?
cache_session: true

# Should the bridge use "X" instead of "Twitter" in certain places,
# such as the management room welcome message and MSC2346 bridge info?
x: false

# Log X login responses at debug level. Only action paths and field names are kept, all other text is hashed.
log_redacted_login_responses: false
